<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Generals Zero Hour - گرگ‌میش - Galaxy A30 Preview</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0A0E14; color:#D4A017; font-family: monospace; overflow:hidden; touch-action:none; }
  #topbar { background:#0A0E14; color:#D4A017; padding:8px 12px; display:flex; justify-content:space-between; align-items:center; font-size:11px; border-bottom:1px solid #8D6E00; }
  #gameCanvas { display:block; background:#556B2F; width:100vw; height: calc(100vh - 108px); touch-action:none; }
  #bottombar { background:#1C2533; display:flex; gap:6px; padding:6px; align-items:center; height:72px; border-top:1px solid #8D6E00; }
  .build-btn { width:56px; height:56px; background:#1C2533; border:1px solid #8D6E00; color:#D4A017; font-size:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; }
  .build-btn:active { background:#D4A017; color:#000; }
  #hint { position:absolute; bottom:84px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); color:#FFD54F; padding:4px 8px; font-size:9px; pointer-events:none; }
  #status { position:absolute; top:44px; left:12px; background:rgba(0,0,0,0.6); color:yellow; padding:4px 8px; font-size:10px; }
  .faction-banner { color:#4CAF50; }
</style>
</head>
<body>
<div id="topbar">
  <span id="credits">Credits: 10000 $</span>
  <span id="power">Power: +120</span>
  <span id="time">00:00 🐑8/8 🐺4</span>
  <span id="faction">USA - گرگ‌میش</span>
</div>
<canvas id="gameCanvas"></canvas>
<div id="hint">لمس کوتاه=انتخاب • نگه‌داشتن=حرکت/حمله • کشیدن=جابجایی نقشه • نیشگون=زوم</div>
<div id="status">گرگ‌میش - از گله محافظت کن! گرگ‌ها از شمال می‌آیند</div>
<div id="bottombar">
  <div class="build-btn" onclick="spawn('dozer')">🚜<br>Dozer</div>
  <div class="build-btn" onclick="spawn('supply')">📦<br>Supply</div>
  <div class="build-btn" onclick="spawn('barracks')">🏠<br>Barracks</div>
  <div class="build-btn" onclick="spawn('fence')">🪵<br>حصار</div>
  <div style="flex:1"></div>
  <div style="width:72px; height:72px; background:#131A26; border:1px solid #8D6E00; display:flex; align-items:center; justify-content:center; font-size:8px; color:#78909C;">RADAR<br>گرگ‌میش</div>
  <button onclick="setMode('attack')" style="width:64px; height:28px; background:#1C2533; color:#D4A017; border:1px solid #8D6E00; font-size:9px;">ATTACK</button>
  <button onclick="stopSelected()" style="width:64px; height:28px; background:#1C2533; color:#D4A017; border:1px solid #8D6E00; font-size:9px; margin-left:4px;">STOP</button>
</div>
<script>
// Port of GeneralsEngine.kt to JS for preview - same logic
let faction = new URLSearchParams(location.search).get('faction') || 'USA';
document.getElementById('faction').textContent = faction + ' - گرگ‌میش';
let camX=1000, camY=1150, zoom=1;
let selected=null, mode='select', ticks=0, credits=10000, paused=false;
let objects=[], sheep=[], wolves=[];

function addObj(o){ objects.push(o); if(o.type==='sheep') sheep.push(o); if(o.type==='wolf'||o.type==='alpha_wolf') wolves.push(o); }

function initMap(){
  addObj({name:'Command Center',x:500,y:500,isBuilding:true,hp:2000,maxHp:2000,owner:faction,type:'hq',state:'idle',tx:500,ty:500,target:null});
  addObj({name:'Supply Center',x:700,y:500,isBuilding:true,hp:1200,maxHp:1200,owner:faction,type:'supply',state:'idle',tx:700,ty:500,target:null});
  addObj({name:'Barracks',x:500,y:700,isBuilding:true,hp:1000,maxHp:1000,owner:faction,type:'barracks',state:'idle',tx:500,ty:700,target:null});
  addObj({name:'Dozer',x:600,y:600,isBuilding:false,hp:200,maxHp:200,owner:faction,type:'dozer',state:'idle',tx:600,ty:600,target:null});
  for(let i=0;i<8;i++){
    let s={name:'Sheep '+(i+1),x:950+(Math.random()*120-60),y:950+(Math.random()*120-60),isBuilding:false,hp:80,maxHp:80,owner:'Sheep',type:'sheep',state:'idle',tx:0,ty:0,target:null};
    s.tx=s.x; s.ty=s.y; addObj(s);
  }
  addObj({name:'Shepherd',x:1000,y:880,isBuilding:false,hp:100,maxHp:100,owner:'Sheep',type:'shepherd',state:'idle',tx:1000,ty:880,target:null});
  for(let i=0;i<3;i++){
    let w={name:'Wolf '+(i+1),x:1000+(Math.random()*200-100),y:1800+Math.random()*100,isBuilding:false,hp:150,maxHp:150,owner:'Wolves',type:'wolf',state:'attacking',tx:0,ty:0,target:sheep[Math.floor(Math.random()*sheep.length)]};
    addObj(w);
  }
  let alpha={name:'Alpha Wolf',x:1000,y:1900,isBuilding:false,hp:300,maxHp:300,owner:'Wolves',type:'alpha_wolf',state:'attacking',tx:0,ty:0,target:sheep[0]};
  addObj(alpha);
  addObj({name:'Wolf Den',x:1000,y:2000,isBuilding:true,hp:1500,maxHp:1500,owner:'Wolves',type:'den',state:'idle',tx:1000,ty:2000,target:null});
}
initMap();

function dist(a,x,y){ let dx=a.x-x, dy=a.y-y; return Math.hypot(dx,dy); }
function worldToScreen(wx,wy){ return [(wx-camX)*zoom + canvas.width/2, (wy-camY)*zoom + canvas.height/2]; }

const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight-108; }
window.addEventListener('resize', resize); resize();

let isDragging=false, lastX=0,lastY=0, isPinching=false, lastDist=0;
canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  if(e.touches.length===1){
    lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
    // Check long press via timer
    let sx=e.touches[0].clientX, sy=e.touches[0].clientY;
    let timer=setTimeout(()=>{
      let wx=(sx/zoom)+camX - canvas.width/2/zoom;
      let wy=(sy/zoom)+camY - canvas.height/2/zoom;
      onWorldTapped(wx,wy,true);
    },400);
    e.target._timer=timer;
  } else if(e.touches.length===2){
    isPinching=true;
    let dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    lastDist=Math.hypot(dx,dy);
  }
},{passive:false});
canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(e.touches.length===1 && !isPinching){
    let dx=e.touches[0].clientX-lastX, dy=e.touches[0].clientY-lastY;
    if(Math.hypot(dx,dy)>8){
      clearTimeout(e.target._timer);
      camX -= dx/zoom; camY -= dy/zoom;
      camX=Math.max(400,Math.min(1600,camX)); camY=Math.max(500,Math.min(1750,camY));
      lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
    }
  } else if(e.touches.length===2){
    clearTimeout(e.target._timer);
    let dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    let d=Math.hypot(dx,dy);
    let factor=d/lastDist;
    zoom=Math.max(0.6,Math.min(2.5,zoom*factor));
    lastDist=d;
  }
},{passive:false});
canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  clearTimeout(e.target._timer);
  if(e.changedTouches.length===1 && !isPinching && e.touches.length===0){
    let t=e.changedTouches[0];
    // If not dragged much, it's a tap
    let dx=t.clientX-lastX, dy=t.clientY-lastY;
    if(Math.hypot(dx,dy)<10){
      let wx=(t.clientX/zoom)+camX - canvas.width/2/zoom;
      let wy=(t.clientY/zoom)+camY - canvas.height/2/zoom;
      // Adjust for topbar offset? canvas is full, but touch is relative to canvas
      let rect=canvas.getBoundingClientRect();
      let cx=t.clientX-rect.left, cy=t.clientY-rect.top;
      wx=(cx/zoom)+camX - canvas.width/2/zoom;
      wy=(cy/zoom)+camY - canvas.height/2/zoom;
      onWorldTapped(wx,wy,false);
    }
  }
  if(e.touches.length===0) isPinching=false;
},{passive:false});
canvas.addEventListener('mousedown', e=>{
  lastX=e.clientX; lastY=e.clientY;
  let timer=setTimeout(()=>{
    let rect=canvas.getBoundingClientRect();
    let cx=e.clientX-rect.left, cy=e.clientY-rect.top;
    let wx=(cx/zoom)+camX - canvas.width/2/zoom;
    let wy=(cy/zoom)+camY - canvas.height/2/zoom;
    onWorldTapped(wx,wy,true);
  },400);
  canvas._timer=timer;
});
canvas.addEventListener('mouseup', e=>{
  clearTimeout(canvas._timer);
  let rect=canvas.getBoundingClientRect();
  let cx=e.clientX-rect.left, cy=e.clientY-rect.top;
  let wx=(cx/zoom)+camX - canvas.width/2/zoom;
  let wy=(cy/zoom)+camY - canvas.height/2/zoom;
  if(Math.hypot(e.clientX-lastX,e.clientY-lastY)<10) onWorldTapped(wx,wy,false);
});
canvas.addEventListener('mousemove', e=>{
  if(e.buttons===1){
    let dx=e.clientX-lastX, dy=e.clientY-lastY;
    camX -= dx/zoom; camY -= dy/zoom;
    camX=Math.max(400,Math.min(1600,camX)); camY=Math.max(500,Math.min(1750,camY));
    lastX=e.clientX; lastY=e.clientY;
    clearTimeout(canvas._timer);
  }
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  zoom=Math.max(0.6,Math.min(2.5, zoom * (e.deltaY<0?1.1:0.9)));
},{passive:false});

function onWorldTapped(wx,wy, longPress){
  if(longPress){
    if(selected){
      if(mode==='attack'){
        let target=objects.find(o=>o.owner==='Wolves' && dist(o,wx,wy)<70);
        if(target){ selected.target=target; selected.state='attacking'; }
        else { selected.tx=wx; selected.ty=wy; selected.state='moving'; selected.target=null; }
      } else {
        selected.tx=wx; selected.ty=wy; selected.state='moving'; selected.target=null;
      }
    }
  } else {
    let tapped=objects.find(o=>dist(o,wx,wy)<55);
    selected=tapped||null;
  }
}
function spawn(type){
  let center=objects.find(o=>o.type==='hq'&&o.owner===faction);
  if(!center) return;
  if(type==='dozer' && credits>=500){ credits-=500; let o={name:'Dozer',x:center.x+80,y:center.y+80,isBuilding:false,hp:200,maxHp:200,owner:faction,type:'dozer',state:'idle',tx:center.x+80,ty:center.y+80,target:null}; addObj(o); selected=o; }
  else if(type==='supply' && credits>=800){ credits-=800; addObj({name:'Supply',x:center.x+(Math.random()*200-100),y:center.y+200,isBuilding:true,hp:800,maxHp:800,owner:faction,type:'supply',state:'idle',tx:0,ty:0,target:null}); }
  else if(type==='barracks' && credits>=1000){ credits-=1000; addObj({name:'Barracks',x:center.x+(Math.random()*200-100),y:center.y+200,isBuilding:true,hp:800,maxHp:800,owner:faction,type:'barracks',state:'idle',tx:0,ty:0,target:null}); }
  else if(type==='fence' && credits>=400){ credits-=400; addObj({name:'Fence',x:center.x+(Math.random()*200-100),y:center.y+200,isBuilding:true,hp:400,maxHp:400,owner:faction,type:'fence',state:'idle',tx:0,ty:0,target:null}); }
  updateHUD();
}
function setMode(m){ mode=m; }
function stopSelected(){ if(selected){ selected.state='idle'; selected.target=null; selected.tx=selected.x; selected.ty=selected.y; } }

function updateHUD(){
  document.getElementById('credits').textContent='Credits: '+credits+' $';
  let sheepAlive=sheep.filter(s=>s.hp>0).length, wolvesAlive=wolves.filter(w=>w.hp>0).length;
  document.getElementById('power').textContent='Power: +'+(80+objects.filter(o=>o.isBuilding&&o.owner===faction).length*20);
  let sec=Math.floor(ticks/60), m=Math.floor(sec/60), s=sec%60;
  document.getElementById('time').textContent=(m<10?'0'+m:m)+':'+(s<10?'0'+s:s)+' 🐑'+sheepAlive+'/'+sheep.length+' 🐺'+wolvesAlive;
}

function tick(){
  if(paused) return;
  ticks++;
  // Update objects
  for(let obj of [...objects]){
    if(obj.hp<=0) continue;
    if(obj.isBuilding) continue;
    if(obj.type==='sheep'){
      if(ticks%90===0 && obj.state==='idle' && Math.random()<0.3){
        obj.tx=950+(Math.random()*200-100); obj.ty=950+(Math.random()*200-100); obj.state='moving';
      }
      let nearestWolf=wolves.filter(w=>w.hp>0).reduce((a,b)=> !a||dist(b,obj.x,obj.y)<dist(a,obj.x,obj.y)?b:a,null);
      if(nearestWolf && dist(nearestWolf,obj.x,obj.y)<120){
        let dx=obj.x-nearestWolf.x, dy=obj.y-nearestWolf.y, d=Math.hypot(dx,dy);
        if(d>1){ obj.tx=obj.x+dx/d*80; obj.ty=obj.y+dy/d*80; obj.state='moving'; }
      }
    }
    if(obj.state==='moving'){
      let dx=obj.tx-obj.x, dy=obj.ty-obj.y, d=Math.hypot(dx,dy);
      let speed= obj.type==='wolf'||obj.type==='alpha_wolf'?2.8 : obj.type==='sheep'?1.8:3;
      if(d>5){ obj.x+=dx/d*speed; obj.y+=dy/d*speed; } else obj.state='idle';
    } else if(obj.state==='attacking'){
      let t=obj.target;
      if(!t || t.hp<=0 || !objects.includes(t)){ obj.state='idle'; obj.target=null; }
      else {
        let d=dist(obj,t.x,t.y), range= obj.type.includes('wolf')?40:80;
        if(d>range){
          obj.tx=t.x; obj.ty=t.y;
          let dx=t.x-obj.x, dy=t.y-obj.y, dist2=Math.hypot(dx,dy);
          let speed= obj.type.includes('wolf')?2.8:2.5;
          obj.x+=dx/dist2*speed; obj.y+=dy/dist2*speed;
        } else {
          let dmg= obj.type==='alpha_wolf'?8: obj.type==='wolf'?5:7;
          t.hp-=dmg;
          if(t.hp<=0){
            let idx=objects.indexOf(t); if(idx>=0) objects.splice(idx,1);
            let sIdx=sheep.indexOf(t); if(sIdx>=0) sheep.splice(sIdx,1);
            let wIdx=wolves.indexOf(t); if(wIdx>=0) wolves.splice(wIdx,1);
            if(selected===t) selected=null;
            if(obj.type.includes('wolf')){
              obj.target=sheep.filter(s=>s.hp>0).reduce((a,b)=>!a||dist(obj,b.x,b.y)<dist(obj,a.x,a.y)?b:a,null) || objects.filter(o=>o.owner===faction).reduce((a,b)=>!a||dist(obj,b.x,b.y)<dist(obj,a.x,a.y)?b:a,null);
              if(!obj.target) obj.state='idle';
            } else { obj.state='idle'; obj.target=null; }
          }
        }
      }
    }
  }
  for(let w of wolves.filter(w=>w.hp>0)){
    if(w.state==='idle' || !w.target || w.target.hp<=0){
      w.target=sheep.filter(s=>s.hp>0).reduce((a,b)=>!a||dist(w,b.x,b.y)<dist(w,a.x,a.y)?b:a,null) || objects.filter(o=>o.owner===faction&&o.hp>0).reduce((a,b)=>!a||dist(w,b.x,b.y)<dist(w,a.x,a.y)?b:a,null);
      if(w.target) w.state='attacking';
    }
  }
  if(ticks%1500===0 && wolves.length<8){
    let nw={name:'Wolf',x:1000+(Math.random()*300-150),y:2050,isBuilding:false,hp:150,maxHp:150,owner:'Wolves',type:'wolf',state:'attacking',tx:0,ty:0,target:sheep.filter(s=>s.hp>0)[0]||objects.find(o=>o.owner===faction)};
    addObj(nw);
  }
  if(ticks%60===0) credits+= 25 * objects.filter(o=>o.type==='supply'&&o.owner===faction).length;
  updateHUD();
  if(sheep.filter(s=>s.hp>0).length===0 && !paused){
    paused=true; alert('شکست! همه گوسفندها خورده شدند - گرگ‌ها پیروز شدند');
  }
}

function render(){
  ctx.fillStyle='#556B2F'; ctx.fillRect(0,0,canvas.width,canvas.height);
  // Village
  let [vsx,vsy]=worldToScreen(650,600); ctx.fillStyle='#C2B280'; ctx.beginPath(); ctx.arc(vsx,vsy,350*zoom,0,Math.PI*2); ctx.fill();
  let [psx,psy]=worldToScreen(1000,950); ctx.fillStyle='#78AA50'; ctx.beginPath(); ctx.arc(psx,psy,180*zoom,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#223C1E'; let fy=worldToScreen(1000,1700)[1]-300*zoom; ctx.fillRect(0,fy,canvas.width,canvas.height-fy);
  ctx.fillStyle='#142814'; for(let i=0;i<9;i++){ let tx=worldToScreen(600+i*150,1850)[0]; ctx.beginPath(); ctx.arc(tx, worldToScreen(0,1850)[1],18*zoom,0,Math.PI*2); ctx.fill(); }
  // Grid
  ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1;
  let gs=100*zoom, sx=(-camX*zoom+canvas.width/2)%gs, sy=(-camY*zoom+canvas.height/2)%gs;
  for(let x=sx;x<canvas.width;x+=gs){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
  for(let y=sy;y<canvas.height;y+=gs){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

  for(let obj of objects){
    let [sx,sy]=worldToScreen(obj.x,obj.y);
    // Shadow
    ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(sx,sy+10*zoom,20*zoom,8*zoom,0,0,Math.PI*2); ctx.fill();
    if(obj.type==='sheep'){
      ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(sx,sy,14*zoom,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#FFE4C4'; ctx.beginPath(); ctx.arc(sx,sy+3*zoom,7*zoom,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='black'; ctx.beginPath(); ctx.arc(sx-3*zoom,sy+1*zoom,2*zoom,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(sx+3*zoom,sy+1*zoom,2*zoom,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(sx-8*zoom,sy-6*zoom,5*zoom,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(sx+8*zoom,sy-6*zoom,5*zoom,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(sx,sy-10*zoom,6*zoom,0,Math.PI*2); ctx.fill();
    } else if(obj.type==='wolf'){
      ctx.fillStyle='#5A5A5A'; ctx.beginPath(); ctx.moveTo(sx,sy-14*zoom); ctx.lineTo(sx+13*zoom,sy+6*zoom); ctx.lineTo(sx+6*zoom,sy+14*zoom); ctx.lineTo(sx-6*zoom,sy+14*zoom); ctx.lineTo(sx-13*zoom,sy+6*zoom); ctx.closePath(); ctx.fill();
      ctx.fillStyle='red'; ctx.beginPath(); ctx.arc(sx-5*zoom,sy-2*zoom,2.5*zoom,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(sx+5*zoom,sy-2*zoom,2.5*zoom,0,Math.PI*2); ctx.fill();
    } else if(obj.type==='alpha_wolf'){
      ctx.fillStyle='#282828'; ctx.beginPath(); ctx.moveTo(sx,sy-18*zoom); ctx.lineTo(sx+16*zoom,sy+8*zoom); ctx.lineTo(sx+8*zoom,sy+18*zoom); ctx.lineTo(sx-8*zoom,sy+18*zoom); ctx.lineTo(sx-16*zoom,sy+8*zoom); ctx.closePath(); ctx.fill();
      ctx.fillStyle='red'; ctx.beginPath(); ctx.arc(sx-6*zoom,sy-2*zoom,3*zoom,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(sx+6*zoom,sy-2*zoom,3*zoom,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='gold'; ctx.beginPath(); ctx.arc(sx,sy-20*zoom,5*zoom,0,Math.PI*2); ctx.fill();
    } else if(obj.type==='den'){
      ctx.fillStyle='#321E0F'; ctx.beginPath(); ctx.ellipse(sx,sy,50*zoom,30*zoom,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='black'; ctx.beginPath(); ctx.ellipse(sx,sy,20*zoom,15*zoom,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='red'; ctx.font=(9*zoom)+'px monospace'; ctx.textAlign='center'; ctx.fillText('DEN',sx,sy+4*zoom);
    } else {
      let base = (obj.owner===faction && obj.isBuilding)?'#1E3C78' : (obj.owner===faction && !obj.isBuilding)? (faction==='USA'?'#1976D2':faction==='China'?'#D32F2F':'#388E3C') : obj.isBuilding?'#781E1E':'#505050';
      ctx.fillStyle=base;
      if(obj.isBuilding){
        ctx.fillRect(sx-30*zoom,sy-25*zoom,60*zoom,50*zoom);
        ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.fillRect(sx-30*zoom,sy-25*zoom,60*zoom,8*zoom);
      } else {
        ctx.beginPath(); ctx.moveTo(sx,sy-16*zoom); ctx.lineTo(sx+14*zoom,sy); ctx.lineTo(sx,sy+16*zoom); ctx.lineTo(sx-14*zoom,sy); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#282828'; ctx.beginPath(); ctx.arc(sx,sy,6*zoom,0,Math.PI*2); ctx.fill();
      }
    }
    if(selected===obj){
      ctx.strokeStyle= (obj.owner===faction||obj.owner==='Sheep')?'#00FF00':'#FF0000'; ctx.lineWidth=3*zoom;
      if(obj.isBuilding||obj.type==='den') ctx.strokeRect(sx-34*zoom,sy-30*zoom,68*zoom,60*zoom);
      else { ctx.beginPath(); ctx.arc(sx,sy,22*zoom,0,Math.PI*2); ctx.stroke(); }
    }
    if(obj.type!=='sheep' || obj.hp<obj.maxHp){
      let pct=obj.hp/obj.maxHp, bw=40*zoom, bh=4*zoom, bx=sx-bw/2, by=sy-(obj.isBuilding||obj.type==='den'?32:26)*zoom;
      ctx.fillStyle='black'; ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle= pct>0.6?'#00FF00':pct>0.3?'yellow':'red'; ctx.fillRect(bx,by,bw*Math.max(0,Math.min(1,pct)),bh);
    }
    ctx.fillStyle='white'; ctx.font=(obj.type==='sheep'?'8px':'10px')+' monospace'; ctx.textAlign='center';
    ctx.shadowColor='black'; ctx.shadowBlur=2;
    let label= obj.type==='alpha_wolf'?'گرگ آلفا':obj.type==='wolf'?'گرگ':obj.type==='sheep'?'🐑':obj.name;
    ctx.fillText(label,sx,sy+30*zoom);
    ctx.shadowBlur=0;
    if(obj.state==='attacking' && obj.target){
      let [tx,ty]=worldToScreen(obj.target.x,obj.target.y);
      ctx.strokeStyle='red'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(tx,ty); ctx.stroke();
      ctx.fillStyle='red'; ctx.beginPath(); ctx.arc(tx,ty,4*zoom,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.fillStyle='yellow'; ctx.font='11px monospace'; ctx.textAlign='left';
  ctx.fillText('گرگ‌میش • گوسفندان:'+sheep.filter(s=>s.hp>0).length+'/'+sheep.length+'  گرگ‌ها:'+wolves.filter(w=>w.hp>0).length,12,22);
}

function loop(){ tick(); render(); requestAnimationFrame(loop); }
loop();
setInterval(()=>{ if(!paused) credits+= 25*objects.filter(o=>o.type==='supply'&&o.owner===faction).length; updateHUD(); },1000);
</script>
</body>
