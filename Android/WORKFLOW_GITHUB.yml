name: Build Generals APK for Galaxy A30

on:
  push:
    branches: [ "arena/019fe382-cnc-generals-zero-hour", "main" ]
    paths:
      - "Android/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Android/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-read-only: false

      - name: Generate Gradle Wrapper (if missing)
        working-directory: Android
        run: |
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper jar missing, generating..."
            gradle wrapper --gradle-version 8.7
            ls -lh gradle/wrapper/
          else
            echo "Wrapper exists"
            ls -lh gradle/wrapper/
          fi

      - name: Make gradlew executable
        run: chmod +x Android/gradlew

      - name: Build Debug APK (Galaxy A30 - arm64-v8a universal)
        working-directory: Android
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Build Release APK (unsigned)
        working-directory: Android
        run: ./gradlew assembleRelease --stacktrace

      - name: Show APK info
        run: |
          ls -lh Android/app/build/outputs/apk/debug/*.apk || true
          ls -lh Android/app/build/outputs/apk/release/*.apk || true
          echo "=== APK details ==="
          for apk in Android/app/build/outputs/apk/debug/*.apk; do
            if [ -f "$apk" ]; then
              echo "Found: $apk"
              unzip -l "$apk" | head -n 40
            fi
          done

      - name: Upload Debug APK (for A30)
        uses: actions/upload-artifact@v4
        with:
          name: Generals-ZeroHour-A30-Debug-APK
          path: Android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Generals-ZeroHour-A30-Release-APK
          path: Android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        run: |
          echo "### ✅ APK Ready for Galaxy A30" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "دانلود APK از تب Artifacts بالا:" >> $GITHUB_STEP_SUMMARY
          echo "- **Generals-ZeroHour-A30-Debug-APK** را دانلود کن" >> $GITHUB_STEP_SUMMARY
          echo "- فایل را به A30 بفرست و نصب کن (Allow unknown apps)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**ساختار PC حفظ شده:** GameLogic / GameClient / INI بدون تغییر - فقط PAL اضافه شده" >> $GITHUB_STEP_SUMMARY
